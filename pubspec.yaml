name: wedify
description: "A production-grade wedding planning app for Malaysia."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.0.0
  flutter_riverpod: ^2.4.9
  dio: ^5.4.0
  google_sign_in: ^6.2.1
  google_maps_flutter: ^2.5.0
  url_launcher: ^6.2.2
  flutter_svg: ^2.0.9
  smooth_page_indicator: ^1.1.0
  shared_preferences: ^2.2.2
  intl: ^0.18.1
  animate_do: ^3.3.4
  cupertino_icons: ^1.0.8
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  geolocator: ^14.0.3
  firebase_core: ^4.13.0
  cloud_firestore: ^6.8.0
  firebase_auth: ^6.5.7
  table_calendar: ^3.0.9
  flutter_stripe: ^14.0.0
  http: ^1.6.0
  flutter_stripe_web: ^8.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
